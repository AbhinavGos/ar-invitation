<style>
  *{box-sizing:border-box}
  :root {
    --bg-dark: #14080a;
    --accent-gold: #f5cb6c;
    --accent-glow: rgba(245,203,108,0.4);
    --border-gold: rgba(235,188,90,0.45);
    --text-main: #fff5e6;
    --text-muted: #e8d4b8;
  }

  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg-dark);color:var(--text-main);font-family:'Montserrat',sans-serif;-webkit-tap-highlight-color:transparent}
  body{touch-action:manipulation}

  /* MindAR container: fills viewport directly */
  #ar-container{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden;z-index:0;display:block}

  /* Scanning Viewfinder Overlay (Portrait Aspect Ratio ~ 1 : 1.55 for Wedding Cards) */
  #scanner-overlay{position:fixed;inset:0;z-index:10;display:none;pointer-events:none;align-items:center;justify-content:center;flex-direction:column}
  .scanner-box{
    width:min(68vw,260px);height:min(105vw,400px);
    border:1.5px solid rgba(245,203,108,.35);border-radius:18px;position:relative;
    box-shadow:0 0 24px rgba(0,0,0,.5),inset 0 0 16px rgba(245,203,108,.08);
  }
  .scanner-box::before, .scanner-box::after {
    content:"";position:absolute;width:24px;height:24px;
    border-color:#ffd782;border-style:solid;pointer-events:none;
  }
  .scanner-box::before {
    top:-2px;left:-2px;border-width:3.5px 0 0 3.5px;border-top-left-radius:18px;
  }
  .scanner-box::after {
    bottom:-2px;right:-2px;border-width:0 3.5px 3.5px 0;border-bottom-right-radius:18px;
  }
  .scanner-corners-alt {
    position:absolute;inset:0;pointer-events:none;
  }
  .scanner-corners-alt::before, .scanner-corners-alt::after {
    content:"";position:absolute;width:24px;height:24px;
    border-color:#ffd782;border-style:solid;pointer-events:none;
  }
  .scanner-corners-alt::before {
    top:-2px;right:-2px;border-width:3.5px 3.5px 0 0;border-top-right-radius:18px;
  }
  .scanner-corners-alt::after {
    bottom:-2px;left:-2px;border-width:0 0 3.5px 3.5px;border-bottom-left-radius:18px;
  }
  .scanner-line {
    position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent,#ffe29e,#dfa248,transparent);
    box-shadow:0 0 16px #f4c068;
    animation:scanSweep 2.2s infinite ease-in-out;
  }
  @keyframes scanSweep {
    0% { top:2%; opacity:0.3; }
    50% { top:96%; opacity:1; }
    100% { top:2%; opacity:0.3; }
  }

  .scanner-hint{margin-top:20px;background:rgba(25,8,12,.88);border:1px solid var(--border-gold);padding:10px 22px;border-radius:999px;font-size:12px;color:var(--accent-gold);letter-spacing:.06em;text-transform:uppercase;backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,0,0,.6);text-align:center}

  /* AR Overlay UI */
  #ui{position:fixed;inset:0;z-index:15;display:none;pointer-events:none}
  .topbar{position:absolute;top:env(safe-area-inset-top,16px);left:0;right:0;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
  .brand{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-gold);text-shadow:0 2px 10px #000}
  .top-actions{display:flex;gap:10px}
  .icon-btn{pointer-events:auto;border:1px solid var(--border-gold);border-radius:50%;width:42px;height:42px;background:rgba(20,8,9,.75);color:var(--accent-gold);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);box-shadow:0 4px 12px rgba(0,0,0,.5)}

  .card-locked-badge{
    position:absolute;top:calc(env(safe-area-inset-top,16px) + 54px);left:50%;transform:translateX(-50%);
    background:rgba(18,28,22,.94);border:1px solid rgba(74,222,128,.65);
    padding:6px 16px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;
    backdrop-filter:blur(10px);letter-spacing:.06em;text-transform:uppercase;
    white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.6);display:none;
    align-items:center;gap:6px;
  }
  .badge-dot {
    width:8px;height:8px;border-radius:50%;
    background:#00ff88;box-shadow:0 0 8px #00ff88;
    display:inline-block;
  }

  /* Bottom Dock with Story Progress & Event Details */
  .bottom-dock{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom,18px));transform:translateX(-50%);width:min(94%,560px);text-align:center;transition:opacity 0.4s ease}
  
  .story-progress-container{display:flex;gap:6px;margin-bottom:10px;padding:0 4px}
  .progress-bar-segment{flex:1;height:3px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden}
  .progress-bar-fill{height:100%;width:0%;background:var(--accent-gold);border-radius:2px;transition:width 0.1s linear}

  .nav-controls{display:flex;justify-content:space-between;align-items:center;background:rgba(28,9,14,.88);border:1px solid var(--border-gold);padding:10px 16px;border-radius:18px;backdrop-filter:blur(12px);box-shadow:0 8px 32px rgba(0,0,0,.7)}
  .arrow-btn{pointer-events:auto;background:rgba(235,188,90,.15);border:1px solid var(--border-gold);color:var(--accent-gold);width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .center-info{flex:1;padding:0 12px}
  .center-info h4{font-family:'Cinzel',serif;margin:0;font-size:15px;color:var(--accent-gold);font-weight:700}
  .center-info p{margin:2px 0 0;font-size:11px;color:var(--text-muted)}

  .card-tabs{display:flex;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap}
  .card-tab-btn{pointer-events:auto;font-family:'Cinzel',serif;font-size:10px;padding:6px 14px;border-radius:999px;border:1px solid rgba(245,203,108,.25);background:rgba(20,8,9,.65);color:#d9c5ab;cursor:pointer;backdrop-filter:blur(4px);white-space:nowrap}
  .card-tab-btn.active{background:linear-gradient(135deg,#f7d785,#d9a138);color:#1c080b;font-weight:700;border-color:#f7d785}

  /* Printable / Second-Screen Target Card Modal */
  #card-modal{position:fixed;inset:0;z-index:30;background:rgba(10,4,6,.92);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(10px)}
  .modal-inner{max-width:380px;width:100%;text-align:center;background:rgba(28,9,14,.95);border:1px solid var(--border-gold);border-radius:22px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.8);max-height:90vh;overflow-y:auto}
  .modal-inner h3{font-family:'Cinzel',serif;margin:0 0 8px;font-size:18px;color:var(--accent-gold)}
  .modal-inner p{font-size:12px;color:var(--text-muted);margin:0 0 16px;line-height:1.4}
  .target-img-preview{width:100%;border-radius:14px;border:1px solid var(--border-gold);box-shadow:0 8px 24px rgba(0,0,0,.6)}
  .close-modal-btn{margin-top:16px;padding:12px 24px;border-radius:999px;border:1px solid var(--border-gold);background:linear-gradient(135deg,#f7d785,#d9a138);color:#21080b;font-family:'Cinzel',serif;font-weight:700;font-size:12px;cursor:pointer;width:100%}

  #loading-view{position:fixed;inset:0;z-index:25;background:var(--bg-dark);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
  .spinner{width:48px;height:48px;border:4px solid rgba(245,203,108,.2);border-top-color:var(--accent-gold);border-radius:50%;animation:spin 1s infinite linear}
  @keyframes spin{to{transform:rotate(360deg)}}
  .load-text{margin-top:18px;font-family:'Cinzel',serif;font-size:14px;color:var(--accent-gold);letter-spacing:.1em}

  #error{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:35;width:min(90%,430px);display:none;text-align:center;background:rgba(25,8,12,.96);padding:26px;border-radius:22px;border:1px solid var(--border-gold);box-shadow:0 16px 40px rgba(0,0,0,.8)}
  #error h3{margin:0 0 10px;font-family:'Cinzel',serif;font-size:22px;color:var(--accent-gold)}
  #error p{margin:0 0 16px;color:#cfc5b7;font-size:14px;line-height:1.5}
  #error .retry-btn{padding:10px 24px;border-radius:999px;border:1px solid var(--border-gold);background:rgba(245,203,108,.15);color:var(--accent-gold);font-size:13px;cursor:pointer}
</style>
</head>
<body>

<!-- AR Container (Camera video background) -->
<div id="ar-container"></div>

<!-- Loading View -->
<div id="loading-view">
  <div class="spinner"></div>
  <div class="load-text" id="loadStatus">Starting Camera &amp; Card Tracker...</div>
</div>

<!-- Scanning Viewfinder -->
<div id="scanner-overlay">
  <div class="scanner-box">
    <div class="scanner-corners-alt"></div>
    <div class="scanner-line"></div>
  </div>
  <div class="scanner-hint" id="scannerHint">✨ Point Camera At Card</div>
</div>

<!-- Target Card Modal -->
<div id="card-modal">
  <div class="modal-inner">
    <h3>Physical Trigger Card</h3>
    <p>Scan this visual target with another device or print it on paper.</p>
    <img src="./target_card.png" alt="Target Card" class="target-img-preview" id="modalTargetImg">
    <button class="close-modal-btn" id="closeCardModal">Back to AR</button>
  </div>
</div>

<!-- AR Overlay UI -->
<div id="ui">
  <div class="topbar">
    <div class="brand" id="topBrand">AR Experience</div>
    <div class="top-actions">
      <button class="icon-btn" id="viewCardBtn" title="View Target Card">🎴</button>
      <button class="icon-btn" id="musicBtn" aria-label="Toggle Music">🔊</button>
      <button class="icon-btn" id="closeBtn" aria-label="Restart AR">↺</button>
    </div>
  </div>

  <div class="card-locked-badge" id="lockedBadge"><span class="badge-dot"></span><span id="lockedText">Card Locked • Playing</span></div>

  <div class="bottom-dock" id="bottomDock">
    <div class="story-progress-container" id="storyProgress">
      <!-- Injected -->
    </div>

    <div class="nav-controls">
      <button class="arrow-btn" id="prevBtn" aria-label="Previous Card">‹</button>
      <div class="center-info">
        <h4 id="dockTitle">Event</h4>
        <p id="dockSubtitle">Details</p>
      </div>
      <button class="arrow-btn" id="nextBtn" aria-label="Next Card">›</button>
    </div>

    <div class="card-tabs" id="cardTabs">
      <!-- Injected -->
    </div>
  </div>
</div>

<div id="error">
  <h3 id="errorTitle">Notice</h3>
  <p id="errorText">Please open this page over an HTTPS URL and allow camera permission.</p>
  <button class="retry-btn" id="dismissError">Dismiss</button>
</div>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';

// ----------------------------------------------------------------------------
// UNIVERSAL WEBAR CONFIGURATION DEFAULTS
// (Can be overridden by scaffold_card.mjs via window.AR_CONFIG)
// ----------------------------------------------------------------------------
const CONFIG = Object.assign({
  name: "AR Card Invitation",
  theme: "royal-wedding",      // royal-wedding | haldi-garden | cocktail-glam | corporate-summit | minimal-luxury
  layout: "hybrid",            // carousel | triptych | diorama | popout | hybrid
  silhouette: "arch",          // arch | scalloped | chamfer | deckled | portal | rect
  depth: "gold-foil",          // gold-foil | silver-chrome | paper-matte | neon-glow | flat
  anchorPosition: "back-edge", // back-edge | center | offset
  cards: [
    { title: "Mehndi & Sagan", date: "Nov 13 · Evening", color: "#f59e0b", type: "mehndi" },
    { title: "Haldi & Baraat", date: "Nov 14 · Morning", color: "#eab308", type: "haldi" },
    { title: "Anand Karaj & Reception", date: "Nov 15 · Evening", color: "#dc2626", type: "wedding" }
  ]
}, window.AR_CONFIG || {});

// Apply Theme Variables
const THEMES = {
  "royal-wedding": {
    bgDark: "#14080a",
    accent: "#f5cb6c",
    border: "rgba(235,188,90,0.45)",
    monogram: "A & N",
    eyebrow: "Royal AR Wedding Invitation",
    particleType: "embers-petals",
    soundType: "shehnai-raga",
    edgeColor: 0xd4af37
  },
  "haldi-garden": {
    bgDark: "#261504",
    accent: "#fbbf24",
    border: "rgba(251,191,36,0.5)",
    monogram: "☀️",
    eyebrow: "Festive Haldi Celebration",
    particleType: "marigold-petals",
    soundType: "acoustic-folk",
    edgeColor: 0xf59e0b
  },
  "cocktail-glam": {
    bgDark: "#090a12",
    accent: "#38bdf8",
    border: "rgba(56,189,248,0.45)",
    monogram: "🍸",
    eyebrow: "Cocktail Soirée & Sangeet",
    particleType: "champagne-bubbles",
    soundType: "lounge-jazz",
    edgeColor: 0x38bdf8
  },
  "corporate-summit": {
    bgDark: "#0b0f19",
    accent: "#38bdf8",
    border: "rgba(56,189,248,0.4)",
    monogram: "◈",
    eyebrow: "Global Keynote & VIP Pass",
    particleType: "cyber-grid",
    soundType: "ambient-tech",
    edgeColor: 0x94a3b8
  },
  "minimal-luxury": {
    bgDark: "#120e0d",
    accent: "#e7ded0",
    border: "rgba(231,222,208,0.4)",
    monogram: "✦",
    eyebrow: "Private Exclusive Invitation",
    particleType: "dust-motes",
    soundType: "minimal-piano",
    edgeColor: 0xe7ded0
  }
};

const currentTheme = THEMES[CONFIG.theme] || THEMES["royal-wedding"];
document.documentElement.style.setProperty('--bg-dark', currentTheme.bgDark);
document.documentElement.style.setProperty('--accent-gold', currentTheme.accent);
document.documentElement.style.setProperty('--border-gold', currentTheme.border);
document.getElementById('topBrand').textContent = CONFIG.name;

// Populate UI progress and ceremony tabs
const storyProgress = document.getElementById('storyProgress');
const cardTabs = document.getElementById('cardTabs');

storyProgress.innerHTML = '';
cardTabs.innerHTML = '';

CONFIG.cards.forEach((c, idx) => {
  const pSeg = document.createElement('div');
  pSeg.className = 'progress-bar-segment';
  pSeg.innerHTML = '<div class="progress-bar-fill"></div>';
  storyProgress.appendChild(pSeg);

  const tBtn = document.createElement('button');
  tBtn.className = `card-tab-btn ${idx === 0 ? 'active' : ''}`;
  tBtn.dataset.index = idx;
  tBtn.textContent = c.title;
  tBtn.onclick = () => setCard(idx);
  cardTabs.appendChild(tBtn);
});

// UI References
const loadingView = document.getElementById('loading-view');
const loadStatus = document.getElementById('loadStatus');
const scannerOverlay = document.getElementById('scanner-overlay');
const ui = document.getElementById('ui');
const errorBox = document.getElementById('error');
const errorText = document.getElementById('errorText');
const dismissError = document.getElementById('dismissError');
const musicBtn = document.getElementById('musicBtn');
const closeBtn = document.getElementById('closeBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const dockTitle = document.getElementById('dockTitle');
const dockSubtitle = document.getElementById('dockSubtitle');
const lockedBadge = document.getElementById('lockedBadge');
const cardModal = document.getElementById('card-modal');
const viewCardBtn = document.getElementById('viewCardBtn');
const closeCardModal = document.getElementById('closeCardModal');
const fills = document.querySelectorAll('.progress-bar-fill');
const cardTabBtns = document.querySelectorAll('.card-tab-btn');

viewCardBtn.onclick = () => { cardModal.style.display = 'flex'; };
closeCardModal.onclick = () => { cardModal.style.display = 'none'; };

// WebAR State
let mindarThree = null;
let anchor = null;
let cardsGroup = null;
let cardMeshes = [];
let particlesGroup = null;
let basePlateGroup = null;
let isTargetFound = false;
let justFoundTarget = false;
let targetFoundTime = 0;
let activeIndex = 0;
let slideStartTime = performance.now();
const DURATION_PER_CARD = 6500;
let isAutoPlaying = true;
let isMuted = false;
let audioCtx = null;

// Orientation Deadband
const parentQuat = new THREE.Quaternion();
const targetLocalQuat = new THREE.Quaternion();
let isReorienting = false;
const ORIENTATION_WAKE_THRESHOLD = 0.065;  // ~3.7°
const ORIENTATION_SLEEP_THRESHOLD = 0.015; // ~0.8°
const REORIENT_SLERP_SPEED = 0.045;

// ----------------------------------------------------------------------------
// PROCEDURAL CANVAS SILHOUETTE & DIE-CUT MASKING
// ----------------------------------------------------------------------------
function applySilhouetteMask(sourceCvs, silhouetteType) {
  const w = sourceCvs.width;
  const h = sourceCvs.height;
  const outCvs = document.createElement('canvas');
  outCvs.width = w;
  outCvs.height = h;
  const ctx = outCvs.getContext('2d');

  ctx.save();
  ctx.beginPath();

  if (silhouetteType === 'arch') {
    // Mughal / Roman arch: straight sides, curved dome top
    const archH = w * 0.45;
    ctx.moveTo(0, h);
    ctx.lineTo(0, archH);
    ctx.quadraticCurveTo(w * 0.15, archH * 0.35, w * 0.5, 0);
    ctx.quadraticCurveTo(w * 0.85, archH * 0.35, w, archH);
    ctx.lineTo(w, h);
    ctx.closePath();
  } else if (silhouetteType === 'scalloped') {
    // Decorative scalloped rounded top edge
    ctx.moveTo(0, h);
    ctx.lineTo(0, 100);
    const scallops = 6;
    const r = (w / scallops) / 2;
    for (let i = 0; i < scallops; i++) {
      const cx = r + i * (2 * r);
      ctx.arc(cx, 100, r, Math.PI, 0, false);
    }
    ctx.lineTo(w, h);
    ctx.closePath();
  } else if (silhouetteType === 'chamfer') {
    // 45-degree modern/corporate chamfered corners
    const c = 60;
    ctx.moveTo(c, 0);
    ctx.lineTo(w - c, 0);
    ctx.lineTo(w, c);
    ctx.lineTo(w, h - c);
    ctx.lineTo(w - c, h);
    ctx.lineTo(c, h);
    ctx.lineTo(0, h - c);
    ctx.lineTo(0, c);
    ctx.closePath();
  } else if (silhouetteType === 'deckled') {
    // Organic torn/deckled paper edge
    ctx.moveTo(0, h);
    let curY = 0;
    ctx.lineTo(0, 30);
    for (let x = 0; x <= w; x += 15) {
      const ny = 20 + Math.sin(x * 0.08) * 12 + Math.cos(x * 0.2) * 6;
      ctx.lineTo(x, ny);
    }
    ctx.lineTo(w, h);
    ctx.closePath();
  } else {
    // Default crisp rounded rectangle
    ctx.roundRect(0, 0, w, h, 28);
  }

  ctx.clip();
  ctx.drawImage(sourceCvs, 0, 0);
  ctx.restore();

  return outCvs;
}

// Procedural Card Canvas Fallback
function createFallbackCardCanvas(type, title, subtitle) {
  const cvs = document.createElement('canvas');
  cvs.width = 720;
  cvs.height = 1080;
  const ctx = cvs.getContext('2d');

  // Background
  const grad = ctx.createLinearGradient(0, 0, 720, 1080);
  if (type === 'haldi') {
    grad.addColorStop(0, '#fef08a');
    grad.addColorStop(1, '#ca8a04');
  } else if (type === 'cocktail') {
    grad.addColorStop(0, '#0f172a');
    grad.addColorStop(1, '#0284c7');
  } else {
    grad.addColorStop(0, '#fffbeb');
    grad.addColorStop(0.5, '#fef3c7');
    grad.addColorStop(1, '#fde68a');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 720, 1080);

  // Border
  ctx.strokeStyle = '#d4af37';
  ctx.lineWidth = 14;
  ctx.strokeRect(24, 24, 720 - 48, 1080 - 48);

  ctx.textAlign = 'center';
  ctx.font = 'bold 52px "Cinzel", serif';
  ctx.fillStyle = '#261405';
  ctx.fillText(CONFIG.name, 360, 220);

  ctx.font = 'bold 38px "Cinzel", serif';
  ctx.fillStyle = '#b45309';
  ctx.fillText(title, 360, 340);

  ctx.font = '600 30px "Montserrat", sans-serif';
  ctx.fillStyle = '#451a03';
  ctx.fillText(subtitle, 360, 420);

  return applySilhouetteMask(cvs, CONFIG.silhouette);
}

// ----------------------------------------------------------------------------
// PROCEDURAL WEB AUDIO SYNTHESIZER
// ----------------------------------------------------------------------------
function initProceduralAudio() {
  if (audioCtx) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;
  audioCtx = new AudioContext();

  const soundType = currentTheme.soundType;

  if (soundType === 'lounge-jazz') {
    // Minor 7th / 9th chords
    const chords = [
      [220.00, 261.63, 329.63, 392.00], // Am7
      [174.61, 220.00, 261.63, 329.63], // Fmaj7
      [196.00, 246.94, 293.66, 349.23], // G7
      [164.81, 196.00, 246.94, 293.66]  // Em7
    ];
    let chordIdx = 0;
    function playJazz() {
      if (!audioCtx || audioCtx.state === 'closed' || isMuted) return;
      const now = audioCtx.currentTime;
      const notes = chords[chordIdx % chords.length];
      chordIdx++;
      notes.forEach(f => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now);
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.06, now + 0.3);
        g.gain.exponentialRampToValueAtTime(0.001, now + 2.2);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 2.3);
      });
      setTimeout(playJazz, 2200);
    }
    playJazz();
  } else if (soundType === 'acoustic-folk') {
    // Pentatonic plucks
    const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
    function playFolk() {
      if (!audioCtx || audioCtx.state === 'closed' || isMuted) return;
      const now = audioCtx.currentTime;
      const f = scale[Math.floor(Math.random() * scale.length)];
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now);
      g.gain.setValueAtTime(0.12, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.65);
      setTimeout(playFolk, 350 + Math.random() * 300);
    }
    playFolk();
  } else {
    // Shehnai Raga loop with Tanpura drone (Default)
    const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
    const melody = [0, 2, 3, 4, 3, 2, 4, 5, 4, 3, 2, 0, 1, 2, 4, 2];
    let noteIdx = 0;
    function playShehnai() {
      if (!audioCtx || audioCtx.state === 'closed' || isMuted) return;
      const now = audioCtx.currentTime;
      const freq = scale[melody[noteIdx % melody.length]];
      noteIdx++;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now);

      const lfo = audioCtx.createOscillator();
      const lfoG = audioCtx.createGain();
      lfo.frequency.setValueAtTime(5.5, now);
      lfoG.gain.setValueAtTime(3.5, now);
      lfo.connect(osc.frequency);
      lfo.start(now);

      g.gain.setValueAtTime(0.001, now);
      g.gain.exponentialRampToValueAtTime(0.14, now + 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.42);

      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.45);
      setTimeout(playShehnai, 400);
    }
    playShehnai();
  }
}

let bgAudio = null;
let hasTriggeredAudio = false;

function primeAudio() {
  if (CONFIG.audioUrl && !bgAudio) {
    bgAudio = new Audio(CONFIG.audioUrl);
    bgAudio.loop = true;
    bgAudio.volume = 0.75;
    bgAudio.preload = 'auto';
  }
}

// User touch before card scan primes audio silently
window.addEventListener('touchstart', primeAudio, { passive: true, once: true });
window.addEventListener('click', primeAudio, { passive: true, once: true });

function startAudioOnLock() {
  if (hasTriggeredAudio) return;
  hasTriggeredAudio = true;

  if (CONFIG.audioUrl) {
    primeAudio();
    bgAudio.play().then(() => {
      isMuted = false;
      musicBtn.textContent = '🔊';
    }).catch(e => {
      console.warn('Audio play on lock deferred until user tap:', e);
      isMuted = true;
      musicBtn.textContent = '🔈';
      const unlockAudio = () => {
        if (bgAudio && bgAudio.paused) {
          bgAudio.play().then(() => {
            isMuted = false;
            musicBtn.textContent = '🔊';
          }).catch(() => {});
        }
        window.removeEventListener('touchstart', unlockAudio);
        window.removeEventListener('click', unlockAudio);
      };
      window.addEventListener('touchstart', unlockAudio, { passive: true });
      window.addEventListener('click', unlockAudio, { passive: true });
    });
  } else {
    initProceduralAudio();
  }
}

function toggleAudio() {
  if (CONFIG.audioUrl && bgAudio) {
    if (bgAudio.paused) {
      bgAudio.play().catch(e => {});
      isMuted = false;
      musicBtn.textContent = '🔊';
    } else {
      bgAudio.pause();
      isMuted = true;
      musicBtn.textContent = '🔇';
    }
  } else {
    if (!audioCtx) initProceduralAudio();
    else if (audioCtx.state === 'suspended') { audioCtx.resume(); isMuted = false; }
    else { isMuted = !isMuted; }
    musicBtn.textContent = isMuted ? '🔇' : '🔊';
  }
}

// ----------------------------------------------------------------------------
// WEBAR INITIALIZATION & 3D SCENE SETUP
// ----------------------------------------------------------------------------
async function startWebAR() {
  loadingView.style.display = 'flex';
  loadStatus.textContent = 'Starting Camera & Card Tracker...';

  // Prepare audio silently; only starts once card target is confirmed
  primeAudio();

  // Container must be visible before MindAR initialization
  const arContainer = document.getElementById('ar-container');
  arContainer.style.display = 'block';

  try {
    mindarThree = new MindARThree({
      container: arContainer,
      imageTargetSrc: './targets.mind',
      filterMinCF: 0.0001,
      filterBeta: 0.01,
      warmupTolerance: 2,
      missTolerance: 80,
      uiLoading: "no",
      uiScanning: "no"
    });

    const { renderer, scene, camera } = mindarThree;

    // Cap devicePixelRatio to 1.5 to eliminate mobile GPU thermal throttling & frame hangs
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));

    // Lighting (gentle to preserve unlit card contrast)
    const ambient = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambient);
    const key = new THREE.DirectionalLight(0xffecd1, 0.85);
    key.position.set(-2, 5, 4);
    scene.add(key);

    // Anchor on Physical Card Target
    anchor = mindarThree.addAnchor(0);

    // ── Persistent AR Stage (Decoupled from anchor.group to survive phone tilts) ──
    const arStage = new THREE.Group();
    arStage.matrixAutoUpdate = false;
    arStage.visible = false;
    scene.add(arStage);

    // ── 1. Ground Pedestal on Card Surface ──
    basePlateGroup = new THREE.Group();
    arStage.add(basePlateGroup);

    // Ornate Rotating Emblem Ring
    const ringGeo = new THREE.RingGeometry(0.20, 0.28, 40);
    const ringMat = new THREE.MeshBasicMaterial({
      color: currentTheme.edgeColor,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.75
    });
    const baseRing = new THREE.Mesh(ringGeo, ringMat);
    basePlateGroup.add(baseRing);

    // Ground Stand Bar
    const standGeo = new THREE.BoxGeometry(0.96, 0.03, 0.016);
    const standMat = new THREE.MeshStandardMaterial({
      color: currentTheme.edgeColor,
      metalness: 0.85,
      roughness: 0.22
    });
    const standMesh = new THREE.Mesh(standGeo, standMat);
    standMesh.position.set(0, -0.02, 0.008);
    basePlateGroup.add(standMesh);

    // ── 2. Cards Group & Spatial Anchor Placement ──
    cardsGroup = new THREE.Group();
    if (CONFIG.anchorPosition === 'back-edge') {
      // Anchored with cards centered comfortably in viewport
      cardsGroup.position.set(0, 0.04, 0.05);
      basePlateGroup.position.set(0, 0.04, 0.005);
    } else if (CONFIG.anchorPosition === 'offset') {
      cardsGroup.position.set(0.55, 0, 0.05);
      basePlateGroup.position.set(0.55, 0, 0.005);
    } else {
      // Centered
      cardsGroup.position.set(0, 0.02, 0.05);
      basePlateGroup.position.set(0, 0.02, 0.005);
    }
    arStage.add(cardsGroup);

    // ── 3. Build 3D Card Meshes (with Cardstock Depth & Bevels) ──
    // Zoomed base dimensions for effortless reading at arm's length
    const cardWidth = 0.88;
    const cardHeight = 1.362;
    const cardDepth = (CONFIG.depth === 'flat') ? 0.0001 : 0.008;

    const cardGeo = new THREE.BoxGeometry(cardWidth, cardHeight, cardDepth);
    cardGeo.translate(0, cardHeight / 2, 0); // Pivot at bottom

    const edgeMat = new THREE.MeshStandardMaterial({
      color: currentTheme.edgeColor,
      metalness: (CONFIG.depth === 'paper-matte') ? 0.05 : 0.88,
      roughness: (CONFIG.depth === 'paper-matte') ? 0.9 : 0.22
    });

    const texLoader = new THREE.TextureLoader();
    cardMeshes = [];

    CONFIG.cards.forEach((c, idx) => {
      let frontMat;
      if (c.url) {
        const tex = texLoader.load(c.url);
        tex.colorSpace = THREE.SRGBColorSpace;
        frontMat = new THREE.MeshBasicMaterial({
          map: tex,
          side: THREE.FrontSide,
          transparent: true,
          opacity: 1.0
        });

        // Apply die-cut silhouette mask if configured
        if (CONFIG.silhouette && CONFIG.silhouette !== 'rect') {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            const cvs = document.createElement('canvas');
            cvs.width = img.naturalWidth || img.width;
            cvs.height = img.naturalHeight || img.height;
            const ctx = cvs.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const maskedCvs = applySilhouetteMask(cvs, CONFIG.silhouette);
            const maskedTex = new THREE.CanvasTexture(maskedCvs);
            maskedTex.colorSpace = THREE.SRGBColorSpace;
            frontMat.map = maskedTex;
            frontMat.needsUpdate = true;
          };
          img.src = c.url;
        }
      } else {
        const cvs = createFallbackCardCanvas(c.type || 'wedding', c.title, c.date);
        const tex = new THREE.CanvasTexture(cvs);
        tex.colorSpace = THREE.SRGBColorSpace;
        frontMat = new THREE.MeshBasicMaterial({
          map: tex,
          side: THREE.FrontSide,
          transparent: true,
          opacity: 1.0
        });
      }

      const backMat = new THREE.MeshBasicMaterial({ color: 0x181216, side: THREE.BackSide, transparent: true, opacity: 0.9 });
      const materials = [edgeMat, edgeMat, edgeMat, edgeMat, frontMat, backMat];

      const mesh = new THREE.Mesh(cardGeo, materials);
      mesh.position.set(0, 0, 0);
      mesh.userData = { index: idx };
      cardsGroup.add(mesh);
      cardMeshes.push(mesh);
    });



    // ── 4. Thematic Particles ──
    particlesGroup = new THREE.Group();
    const particleCount = 45;
    const pGeo = new THREE.PlaneGeometry(0.035, 0.055);
    const pMat1 = new THREE.MeshBasicMaterial({ color: currentTheme.edgeColor, side: THREE.DoubleSide });
    const pMat2 = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });

    for (let i = 0; i < particleCount; i++) {
      const pm = (Math.random() > 0.4) ? pMat1 : pMat2;
      const p = new THREE.Mesh(pGeo, pm);
      p.position.set((Math.random() - 0.5) * 1.8, Math.random() * 1.8, (Math.random() - 0.5) * 0.8);
      p.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
      p.userData = {
        speedY: 0.004 + Math.random() * 0.007,
        rotSpeed: 0.015 + Math.random() * 0.03,
        driftX: (Math.random() - 0.5) * 0.002
      };
      particlesGroup.add(p);
    }
    cardsGroup.add(particlesGroup);

    // ── Persistent Transform & Pose Smoothing Matrices ──
    const targetPos = new THREE.Vector3();
    const targetQuat = new THREE.Quaternion();
    const targetScale = new THREE.Vector3();
    const currentPos = new THREE.Vector3();
    const currentQuat = new THREE.Quaternion();
    const currentScale = new THREE.Vector3();
    const lastValidMatrix = new THREE.Matrix4();
    let isPoseInitialized = false;
    let hasEverLocked = false;

    // Tracking events
    anchor.onTargetFound = () => {
      isTargetFound = true;
      if (!hasEverLocked) {
        justFoundTarget = true;
        targetFoundTime = performance.now();
      }
      hasEverLocked = true;
      scannerOverlay.style.display = 'none';
      lockedBadge.style.display = 'flex';
      const lt = document.getElementById('lockedText');
      if (lt) lt.textContent = 'Card Locked • Playing';

      // Start audio ONLY once card is triggered
      startAudioOnLock();

      if (navigator.vibrate) {
        try { navigator.vibrate(60); } catch(e) {}
      }
    };

    anchor.onTargetLost = () => {
      isTargetFound = false;

      // STICKY PERSISTENCE: Once locked, DO NOT collapse 3D scene, DO NOT pause audio, DO NOT flash scanner box!
      if (hasEverLocked) {
        scannerOverlay.style.display = 'none';
        lockedBadge.style.display = 'flex';
        const lt = document.getElementById('lockedText');
        if (lt) lt.textContent = 'Card Anchored • Playing';
        return;
      }

      scannerOverlay.style.display = 'flex';
      lockedBadge.style.display = 'none';
    };

    await mindarThree.start();

    if (typeof mindarThree.resize === 'function') {
      mindarThree.resize();
    }

    loadingView.style.display = 'none';
    scannerOverlay.style.display = 'flex';
    ui.style.display = 'block';

    setCard(0);

    // Render loop with sticky persistence and anti-tremor interpolation
    renderer.setAnimationLoop(() => {
      try {
        if (anchor && anchor.group && arStage) {
          const m = anchor.group.matrix.elements;
          const isTracking = (m[0] !== 0 || m[5] !== 0 || m[10] !== 0);

          if (isTracking) {
            anchor.group.matrix.decompose(targetPos, targetQuat, targetScale);

            if (!isPoseInitialized) {
              currentPos.copy(targetPos);
              currentQuat.copy(targetQuat);
              currentScale.copy(targetScale);
              isPoseInitialized = true;
            } else {
              // Smooth lerp/slerp to dampen hand tremors and grazing angle jitters
              currentPos.lerp(targetPos, 0.35);
              currentQuat.slerp(targetQuat, 0.35);
              currentScale.lerp(targetScale, 0.35);
            }

            arStage.matrix.compose(currentPos, currentQuat, currentScale);
            arStage.matrixWorld.copy(arStage.matrix);
            arStage.matrixWorldNeedsUpdate = true;
            lastValidMatrix.copy(arStage.matrix);
            arStage.visible = true;
          } else if (hasEverLocked) {
            // Maintain last valid anchor pose so cards remain pinned on table without disappearing
            arStage.matrix.copy(lastValidMatrix);
            arStage.matrixWorld.copy(arStage.matrix);
            arStage.matrixWorldNeedsUpdate = true;
            arStage.visible = true;
          }
        }

        updateOrientation(arStage);
        updateLayoutAnimation();
        updateParticles();
        updateStoryProgress();
        if (baseRing) baseRing.rotation.z += 0.007;
      } catch (err) {
        console.warn('Render loop warning:', err);
      }
      try {
        renderer.render(scene, camera);
      } catch (rErr) {
        console.error('Render error:', rErr);
      }
    });

  } catch (err) {
    console.error('WebAR Tracker Error:', err);
    loadingView.style.display = 'none';
    arContainer.style.display = 'none';
    errorText.textContent = err?.message || 'Could not start camera or AR tracking.';
    errorBox.style.display = 'block';
  }
}

// ----------------------------------------------------------------------------
// LAYOUT CHOREOGRAPHY ENGINES
// ----------------------------------------------------------------------------
function updateLayoutAnimation() {
  if ((!isTargetFound && !hasEverLocked) || !cardsGroup) return;

  const now = performance.now();
  const timeSinceFound = (now - targetFoundTime) / 1000; // in seconds

  const mode = CONFIG.layout;

  cardMeshes.forEach((mesh, i) => {
    let targetX = 0;
    let targetZ = 0;
    let targetRotY = 0;
    let targetScale = 1.0;
    let targetOpacity = 1.0;

    if (mode === 'triptych') {
      // 3-Panel Panoramic Stage (Always active)
      const diff = i - 1; // Center is index 1
      targetX = diff * 0.96;
      targetZ = (diff === 0) ? 0.08 : -Math.abs(diff) * 0.14;
      targetRotY = -diff * 0.28;
      targetScale = (i === 1) ? 1.10 : 0.90;
      targetOpacity = 1.0;
    } else if (mode === 'diorama') {
      // Multi-layer Z-depth optical corridor with zoomed foreground card
      const diff = i - activeIndex;
      if (diff === 0) {
        targetX = 0;
        targetZ = 0.15; // Closer to camera for zoomed reading
        targetRotY = 0;
        targetScale = 1.15; // Prominent zoom
        targetOpacity = 1.0;
      } else if (diff > 0) {
        targetX = diff * 0.06;
        targetZ = 0.02 - (diff * 0.18);
        targetRotY = -0.04 * Math.min(diff, 2);
        targetScale = Math.max(0.65, 0.96 - diff * 0.08);
        targetOpacity = Math.max(0.32, 0.96 - diff * 0.18);
      } else {
        targetX = -0.74 + diff * 0.12;
        targetZ = 0.08 + Math.abs(diff) * 0.04;
        targetRotY = 0.32;
        targetScale = 0.80;
        targetOpacity = 0.35;
      }
    } else if (mode === 'popout') {
      // Frame-break anamorphic pop-out
      if (i === 0) {
        // Background frame window
        targetX = 0; targetZ = 0; targetScale = 1.0; targetOpacity = 0.95;
      } else {
        // Hero subject popping out forward
        targetX = 0; targetZ = 0.08; targetScale = 1.25; targetOpacity = 1.0;
      }
    } else if (mode === 'hybrid') {
      // Grand Reveal for first 3.2s, then smooth glide to focused carousel
      if (timeSinceFound < 3.2) {
        const mid = (cardMeshes.length - 1) / 2;
        const diff = i - mid;
        targetX = diff * 0.78;
        targetZ = (diff === 0) ? 0.12 : -Math.abs(diff) * 0.14;
        targetRotY = -diff * 0.24;
        targetScale = (diff === 0) ? 1.15 : 0.86;
        targetOpacity = 1.0;
      } else {
        // Glide into active carousel
        const diff = i - activeIndex;
        targetX = diff * 0.90;
        targetZ = (diff === 0) ? 0.12 : -Math.abs(diff) * 0.24;
        targetRotY = -diff * 0.22;
        targetScale = (diff === 0) ? 1.15 : 0.72;
        targetOpacity = (diff === 0) ? 1.0 : 0.48;
      }
    } else {
      // Default: Focused Carousel Stack
      const diff = i - activeIndex;
      targetX = diff * 0.90;
      targetZ = (diff === 0) ? 0.12 : -Math.abs(diff) * 0.24;
      targetRotY = -diff * 0.22;
      targetScale = (diff === 0) ? 1.15 : 0.72;
      targetOpacity = (diff === 0) ? 1.0 : 0.48;
    }

    mesh.position.x += (targetX - mesh.position.x) * 0.08;
    mesh.position.z += (targetZ - mesh.position.z) * 0.08;
    mesh.rotation.y += (targetRotY - mesh.rotation.y) * 0.08;

    const curScale = mesh.scale.x;
    const newScale = curScale + (targetScale - curScale) * 0.08;
    mesh.scale.set(newScale, newScale, newScale);

    if (Array.isArray(mesh.material) && mesh.material[4]) {
      mesh.material[4].opacity += (targetOpacity - mesh.material[4].opacity) * 0.08;
    }
  });
}

function updateParticles() {
  if (!particlesGroup || (!isTargetFound && !hasEverLocked)) return;
  particlesGroup.children.forEach(p => {
    p.position.y -= p.userData.speedY;
    p.position.x += p.userData.driftX;
    p.rotation.x += p.userData.rotSpeed;
    p.rotation.y += p.userData.rotSpeed;
    if (p.position.y < 0.0) {
      p.position.y = 1.7;
      p.position.x = (Math.random() - 0.5) * 1.8;
      p.position.z = (Math.random() - 0.5) * 0.8;
    }
  });
}

function setCard(idx) {
  if (idx < 0) idx = CONFIG.cards.length - 1;
  activeIndex = idx % CONFIG.cards.length;
  slideStartTime = performance.now();

  const data = CONFIG.cards[activeIndex];
  dockTitle.textContent = data.title;
  dockSubtitle.textContent = data.date;

  cardTabBtns.forEach((btn, i) => {
    if (i === activeIndex) btn.classList.add('active');
    else btn.classList.remove('active');
  });
}

// ── Anti-Tremor Deadband Camera-Facing Orientation ──
function updateOrientation(stage) {
  if (!stage || !stage.visible || !cardsGroup) return;

  stage.getWorldQuaternion(parentQuat);
  targetLocalQuat.copy(parentQuat).invert();

  if (justFoundTarget) {
    cardsGroup.quaternion.copy(targetLocalQuat);
    justFoundTarget = false;
    isReorienting = false;
    return;
  }

  const angleDiff = cardsGroup.quaternion.angleTo(targetLocalQuat);
  if (!isReorienting && angleDiff > ORIENTATION_WAKE_THRESHOLD) {
    isReorienting = true;
  }

  if (isReorienting) {
    cardsGroup.quaternion.slerp(targetLocalQuat, REORIENT_SLERP_SPEED);
    if (angleDiff < ORIENTATION_SLEEP_THRESHOLD) {
      isReorienting = false;
    }
  }
}

function updateStoryProgress() {
  if (!isAutoPlaying || CONFIG.layout === 'triptych') return;

  const now = performance.now();
  const elapsed = now - slideStartTime;
  const progress = Math.min(1.0, elapsed / DURATION_PER_CARD);

  fills.forEach((fill, i) => {
    if (i < activeIndex) fill.style.width = '100%';
    else if (i === activeIndex) fill.style.width = (progress * 100) + '%';
    else fill.style.width = '0%';
  });

  if (elapsed >= DURATION_PER_CARD) {
    setCard(activeIndex + 1);
  }
}

function closeAR() {
  if (mindarThree) {
    try { mindarThree.stop(); } catch(e) {}
  }
  if (bgAudio) {
    bgAudio.pause();
    bgAudio.currentTime = 0;
  }
  window.location.reload();
}

// Event Listeners
prevBtn.onclick = () => setCard(activeIndex - 1);
nextBtn.onclick = () => setCard(activeIndex + 1);
closeBtn.onclick = closeAR;
musicBtn.onclick = toggleAudio;
dismissError.onclick = () => { errorBox.style.display = 'none'; startWebAR(); };

// Interactive Pinch-To-Zoom Touch Support
let userZoom = 1.0;
let initialPinchDist = null;
let initialZoom = 1.0;

window.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    initialPinchDist = Math.hypot(dx, dy);
    initialZoom = userZoom;
  }
}, { passive: true });

window.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2 && initialPinchDist) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const factor = dist / initialPinchDist;
    userZoom = Math.max(0.85, Math.min(1.85, initialZoom * factor));
    if (cardsGroup) {
      cardsGroup.scale.set(userZoom, userZoom, userZoom);
    }
  }
}, { passive: true });

window.addEventListener('touchend', (e) => {
  if (e.touches.length < 2) {
    initialPinchDist = null;
  }
}, { passive: true });

// Automatically launch WebAR camera immediately on load
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', startWebAR);
} else {
  startWebAR();
}
</script>
